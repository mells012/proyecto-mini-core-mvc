# Render Blueprint: define ambos servicios del proyecto (backend + frontend)
# para poder desplegarlos juntos con "New > Blueprint" en Render, apuntando
# a este repositorio. Tambien se pueden crear manualmente como dos
# servicios separados siguiendo el DEPLOY.md.

services:
  # --- Backend: Django + DRF como Web Service -----------------------------
  - type: web
    name: mini-core-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "mini-core-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://mini-core-frontend.onrender.com"
      - key: PYTHON_VERSION
        value: "3.13.0"

  # --- Frontend: React (Vite) como Static Site ----------------------------
  - type: web
    name: mini-core-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        value: "https://mini-core-backend.onrender.com/api"
    routes:
      # Necesario para que las rutas de React Router (ej. /comisiones)
      # funcionen al recargar o acceder directamente por URL.
      - type: rewrite
        source: /*
        destination: /index.html
